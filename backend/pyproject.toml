[project]
name = "hr-chan-backend"
version = "0.1.0"
description = "Hiring and onboarding modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pgvector>=0.3,<1",
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.9,<3",
  "email-validator>=2.2,<3",
  "aiosmtplib>=3.0,<5",
  "apscheduler>=3.11,<4",
  "cryptography>=43,<47",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7",
  "defusedxml>=0.7.1,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = ["database: requires TEST_DATABASE_URL pointing to a migrated test database"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
