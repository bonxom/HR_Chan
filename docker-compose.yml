services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hr_chan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: hr_chan
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_chan -d hr_chan"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development-only SMTP capture mailbox. Start with: docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Quét mã độc CV (clamd INSTREAM), chỉ mở trên loopback. Khởi động:
  # docker compose --profile scan up -d  (lần đầu tải chữ ký có thể mất vài phút).
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  postgres_data:
  clamav_data:
