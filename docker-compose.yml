services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hr_chan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: hr_chan
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_chan -d hr_chan"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
