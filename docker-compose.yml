services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hr_chan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: hr_chan
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_chan -d hr_chan"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development-only SMTP capture mailbox. Start with: docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
